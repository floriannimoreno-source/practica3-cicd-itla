<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas DevOps — ITLA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #1f3b63; } li.hecha { text-decoration: line-through; color: #777; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; } li span { cursor: pointer; flex: 1; }
    button.borrar { background: #fff; border: 1px solid #c0392b; color: #c0392b; border-radius: 4px; cursor: pointer; }
    form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; } button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Lista de tareas</h1>
  <p id="aviso">Versión estática (GitHub Pages). Ejecuta <code>npm start</code> para usar la API.</p>
  <form id="f"><input id="t" placeholder="Nueva tarea" required><button>Agregar</button></form>
  <ul id="l"></ul>
  <script>
    const l = document.getElementById('l');
    async function cargar() {
      try {
        const r = await fetch('/api/tareas'); if (!r.ok) throw 0;
        document.getElementById('aviso').hidden = true;
        l.innerHTML = '';
        (await r.json()).forEach(t => {
          const li = document.createElement('li');
          const texto = document.createElement('span'); texto.textContent = t.titulo;
          if (t.completada) li.className = 'hecha';
          texto.onclick = async () => { await fetch('/api/tareas/' + t.id, { method: 'PATCH' }); cargar(); };
          const del = document.createElement('button'); del.textContent = 'Borrar'; del.className = 'borrar';
          del.onclick = async () => { await fetch('/api/tareas/' + t.id, { method: 'DELETE' }); cargar(); };
          li.append(texto, del);
          l.appendChild(li);
        });
      } catch (e) { /* sin API: modo estático */ }
    }
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      await fetch('/api/tareas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo: document.getElementById('t').value }) });
      document.getElementById('t').value = ''; cargar();
    };
    cargar();
  </script>
</body>
</html>
